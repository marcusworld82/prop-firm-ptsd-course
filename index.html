<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Prop Firm PTSD online course website.">
<title>Prop Firm PTSD Course</title>
<style>
:root{--bg:#0A0E14;--panel:#111822;--panel2:#182231;--text:#E0E0E0;--muted:#9aa7b6;--green:#39FF14;--red:#D92D20;--line:rgba(224,224,224,.14)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0,rgba(57,255,20,.08),transparent 420px),var(--bg);color:var(--text);font-family:Inter,Roboto,Arial,sans-serif;line-height:1.65}.app{display:grid;grid-template-columns:minmax(0,1fr)370px;min-height:100vh}main{height:100vh;overflow:auto;padding:clamp(24px,5vw,64px)}article{max-width:900px;margin:auto;background:rgba(17,24,34,.82);border:1px solid var(--line);border-radius:8px;padding:clamp(22px,4vw,46px);box-shadow:0 20px 60px rgba(0,0,0,.35)}aside{height:100vh;overflow:auto;background:rgba(8,12,18,.96);border-left:1px solid var(--line);padding:22px}.side-head{position:sticky;top:0;background:rgba(8,12,18,.98);z-index:2;margin:-22px -22px 18px;padding:22px;border-bottom:1px solid var(--line)}h1{font-size:clamp(2rem,5vw,3.9rem);line-height:1.04;margin:0 0 18px;color:white}h2{font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.2;margin:30px 0 12px;color:white}h3{margin:22px 0 8px;color:white}.eyebrow{color:var(--green);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;margin-bottom:18px}.muted{color:var(--muted);font-weight:700}.green{color:var(--green);font-weight:900}.warn{border-left:4px solid var(--red);background:rgba(217,45,32,.13);border-radius:6px;padding:13px 15px}.overview{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:28px}.overview-title{font-size:clamp(1.75rem,4vw,3rem)}.sub{color:var(--green);font-size:1.18rem;font-weight:850}.cta{display:inline-block;background:var(--green);color:#041006;border-radius:6px;padding:10px 14px;font-weight:900}.bar-meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;font-size:.88rem}.bar{height:10px;border-radius:999px;background:#1d2633;border:1px solid var(--line);overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#20ca00,var(--green));box-shadow:0 0 16px rgba(57,255,20,.7);transition:width .25s}.module{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin:0 0 12px;overflow:hidden}.module[open] summary{border-bottom:1px solid var(--line)}summary{list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer;padding:13px 14px;min-height:56px}summary::-webkit-details-marker{display:none}.module.locked{opacity:.58}.check{display:grid;place-items:center;min-width:26px;height:26px;border:1px solid var(--line);border-radius:99px;font-weight:900}.done .check{background:var(--green);border-color:var(--green);color:#041006}.lessons{display:grid;gap:4px;padding:8px}.lesson-btn{position:relative;width:100%;min-height:44px;text-align:left;border:0;border-left:3px solid transparent;border-radius:5px;background:transparent;color:var(--text);padding:9px 10px;cursor:pointer}.lesson-btn:hover{background:rgba(224,224,224,.06)}.lesson-btn.active{border-left-color:var(--green);background:rgba(57,255,20,.13);color:white}.lesson-btn.locked{color:var(--muted);cursor:not-allowed}.lesson-btn.locked:hover:after{content:'Complete previous module first.';position:absolute;right:8px;bottom:calc(100% + 7px);width:max-content;max-width:220px;background:#202a38;color:white;border:1px solid var(--line);border-radius:5px;padding:7px 9px;z-index:4}.quiz{margin-top:34px;background:#0c131d;border:1px solid var(--line);border-radius:8px;padding:22px}.quiz.done{background:rgba(57,255,20,.13);border-color:rgba(57,255,20,.45)}fieldset{border:0;margin:0 0 18px;padding:0}legend{font-weight:900;color:white;margin-bottom:8px}.option{display:flex;gap:10px;align-items:flex-start;min-height:42px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:rgba(224,224,224,.04)}input{accent-color:var(--green)}button.primary,.drawer-btn,.close{border:0;border-radius:6px;background:var(--green);color:#041006;font-weight:900;min-height:44px;padding:11px 16px;cursor:pointer}button.secondary{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:6px;font-weight:900;min-height:44px;padding:11px 16px}.actions{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);margin-top:30px;padding-top:22px}.feedback{min-height:28px;font-weight:900}.error{color:#ffb0aa}.success{color:var(--green)}.drawer-btn,.close,.shade{display:none}@media(max-width:900px){.app{display:block}main{height:auto;min-height:100vh;padding-top:82px}aside{position:fixed;inset:0 0 0 auto;width:min(92vw,390px);transform:translateX(100%);transition:.22s;z-index:30}aside.open{transform:translateX(0)}.drawer-btn{display:block;position:fixed;top:14px;right:14px;z-index:20}.close{display:inline-block}.shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;z-index:25;transition:.18s}.shade.open{opacity:1;pointer-events:auto}}@media(max-width:560px){main{padding-inline:16px}article{padding:20px 16px}.actions{flex-direction:column}.actions button{width:100%}}
</style>
</head>
<body>
<button class="drawer-btn" id="openNav" type="button">Modules</button><div class="shade" id="shade"></div>
<div class="app">
<main id="main" tabindex="-1"><article id="content" aria-live="polite"></article></main>
<aside id="sidebar" aria-label="Course modules"><div class="side-head"><div style="display:flex;gap:12px;justify-content:space-between"><h2 style="margin:0 0 14px;font-size:1.18rem">Prop Firm PTSD: How to Stop Losing Accounts and Start Making $500 a Day</h2><button class="close" id="closeNav" type="button">Close</button></div><div class="bar-meta"><span>Course Progress</span><span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div></div><nav id="nav"></nav></aside>
</div>
<script>
/* Replace lesson text in modules[].lessons[].body and quiz text in modules[].quiz when your final course copy is ready. answer is the zero-based correct option index. */
const intro={title:'Prop Firm PTSD: How to Stop Losing Accounts and Start Making $500 a Day',sub:'A step-by-step course that shows futures traders how to stop blowing prop firm accounts, stack five 50K accounts, and use one simple daily target to change their income.',hook:'If you have ever passed a prop evaluation, blown the funded account, and then felt sick looking at the screen, this course is for you. This course is about rules, mindset, and a simple way to trade that lets you keep accounts alive and get paid.',learn:['Why you keep losing prop accounts even when your strategy is good','Why the 50K account is the sweet spot for most futures traders','How to use a $300-$500 per account daily target','How to set up five 50K accounts and use copy trading','How to move your stop into profit and protect your day','How to run and repeat the 10K Week Challenge'],for:['Futures traders who keep failing prop firm challenges','Traders who got funded once, then blew the account','People with a job who want serious side income','Traders who want a simple multi-account system'],get:['5 modules and 15 short lessons','Clear daily rules','A five-account funding plan','A repeatable 10K Week Challenge','Lifetime access']};
const modules=[
{title:'Why You Keep Losing Prop Accounts',goal:'See that the issue is not that you are bad at trading. You need the right rules and mindset for the prop firm game.',lessons:[['Prop Firm PTSD: The Real Problem',['You are not failing because you are stupid or lazy. You are failing because you treat prop firms like a lottery instead of a business.','The evaluation is a discipline test. Prop firms punish oversized risk, rushed targets, and emotional resets.','Write this down: This is a discipline test, not a lottery ticket.']],['The 50K Sweet Spot (And Why Bigger Is a Trap)',['Bigger accounts sound exciting, but they often create bigger pressure, bigger drawdowns, and bigger mistakes.','The 50K account gives you a reasonable target, tight enough limits, and a calmer way to stack accounts.','Five 50K accounts can outperform one huge account that you cannot manage well.']],['The $500-a-Day Mindset',['You do not need to make thousands per account to change your income. You need a boring number you can repeat.','The target is $300-$500 per account per day. Across five accounts, that becomes meaningful income without forcing trades.','Your job is to hit the number, protect it, and show up again tomorrow.']]],quiz:[['What is the main test inside a prop firm evaluation?',['Finding the biggest account','Discipline and survival day after day','Trading as many contracts as possible'],1],['Why focus on 50K accounts?',['They balance opportunity with manageable stress','They remove the need for rules','They always pay more'],0]]},
{title:'Building Your Five-Account Stack',goal:'Choose a funding path and understand how to build five 50K accounts.',lessons:[['Why You Get All Five Accounts at Once',['Adding accounts one at a time keeps many traders stuck in evaluation mode.','Opening five 50K accounts up front lets you learn one system, pass together, and trade together.','You stop treating one account as special and start running a business process.']],['Three Paths to Five Accounts',['Path one is a cheaper evaluation route. Path two is a standard evaluation route. Path three is straight-to-funded.','Each route has a different cost, speed, and stress level. The destination is the same: five 50K accounts.','Pick the path that fits your budget and your honest current skill level.']],['Setting Up Your Copier (Tradovate / WealthCharts)',['Your edge is not clicking faster. Your edge is one clean setup copied across every account.','Use a master account and link the others so entries, stops, and exits stay consistent.','Test the copier in simulation before placing live trades across all accounts.']]],quiz:[['Why build five accounts together?',['To trade five random strategies','To grow faster while treating the setup like one system','To avoid using a plan'],1],['What should you test first?',['The copier in sim or demo','Only your internet speed','A larger account size'],0]]},
{title:'Daily Execution: How to Trade Without Blowing Up',goal:'Turn simple rules into a daily routine that protects your accounts.',lessons:[['The Daily Code: Your Non-Negotiable Rules',['You do not rise to your goals. You fall to your rules.','Your Daily Code should define max loss, two-loss stop, profit lock rules, and your trading window.','Rules are not suggestions. They are lines you do not cross while the market is open.']],['The Lock-In Rule: Moving Your Stop Into Profit',['Once you are paid, your only job is to protect the paycheck.','When the trade reaches your $300-$500 goal per account, move the stop into profit.','A runner is a bonus. Protecting the first daily target is the main job.']],['Trading Your Window, Not the Whole Day',['More screen time often creates boredom, impulse trades, and rule breaks.','Choose a 60 to 120 minute window with good movement and trade only your best setup.','Outside that window, do not chase price. Protect your focus for tomorrow.']]],quiz:[['What should your Daily Code do?',['Give clear lines you do not cross','Change every few minutes','Help you trade all day'],0],['What does the Lock-In Rule protect?',['The first daily profit target','A random entry','The biggest position size'],0]]},
{title:'The 10K Week Challenge',goal:'Put the system together for one focused week using five accounts and strict rules.',lessons:[['Challenge Prep: Gear, Accounts, and Mindset',['Do not start until your accounts, copier, Daily Code, trading window, and daily goal are ready.','The challenge proves you can follow rules across five accounts for five days.','If something is not ready, delay the challenge instead of winging it.']],['A Model $500 Day (Walkthrough)',['A model day starts with checking rules, marking levels, and planning the first trade.','When P&L reaches the daily goal, move the stop into profit and protect the day.','Success is measured by rule-following, not a huge emotional number.']],['The 5-Day 10K Week Plan',['Days 1-2 build the foundation. Days 3-4 prove consistency. Day 5 is review and finish.','Use the same rules, same goal, and same window all week.','If you followed your rules, you won the challenge even if the math was not perfect.']]],quiz:[['When should you start the challenge?',['As soon as you feel excited','Only after accounts, copier, rules, window, and goal are ready','After one lucky trade'],1],['What is the challenge mainly proving?',['That you can follow rules for a full week','That you can trade all day','That you never need review'],0]]},
{title:'Troubleshooting, Case Studies, and Next Steps',goal:'Know what to do when things go wrong and how to grow after a strong week.',lessons:[['When You Break Your Own Rules',['You will break a rule at some point. What matters is how you respond.','Stop trading, write down what happened, name the feeling that came before it, and apply a reset consequence.','The goal is not shame. The goal is training your brain that rules matter.']],['Good Week vs Bad Week (Case Studies)',['A good week can still have rough days if the rules are followed.','A bad week usually comes from giving back profit, ignoring stops, or trading outside your window.','The market is not the main difference. Your behavior is.']],['Life After Your First 10K Week',['One strong week is not the finish line. The goal is a repeatable system that fits your life.','Do not rush to double risk. Repeat the process and build stability over time.','Trading should support the life you want, not replace every other plan.']]],quiz:[['What should you do first after breaking a rule?',['Stop trading for the day','Trade bigger to recover','Ignore it'],0],['What matters after a strong week?',['Doubling risk immediately','Repeating the system with stability','Trading without a window'],1]]}
];
const KEY='propFirmPtsdCourseProgress';let state={m:0,l:0,done:[]};const $=id=>document.getElementById(id);function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s){state={m:s.m||0,l:s.l||0,done:Array.isArray(s.done)?s.done:[]}}}catch(e){}if(!unlocked(state.m)){state.m=0;state.l=0}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function complete(i){return state.done.includes(i)}function unlocked(i){return i===0||complete(i-1)}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function nav(){ $('nav').innerHTML=modules.map((m,i)=>`<details class="module ${complete(i)?'done':''} ${unlocked(i)?'':'locked'}" ${i===state.m||unlocked(i)&&!complete(i)?'open':''}><summary><strong>Module ${i+1} - ${esc(m.title)}</strong><span class="check">${complete(i)?'✓':unlocked(i)?'•':'×'}</span></summary><div class="lessons">${m.lessons.map((l,j)=>`<button class="lesson-btn ${i===state.m&&j===state.l?'active':''} ${unlocked(i)?'':'locked'}" data-m="${i}" data-l="${j}" title="${unlocked(i)?'':'Complete previous module first.'}">Lesson ${i+1}.${j+1}: ${esc(l[0])}</button>`).join('')}</div></details>`).join('');document.querySelectorAll('.lesson-btn').forEach(b=>b.onclick=()=>{const m=+b.dataset.m,l=+b.dataset.l;if(!unlocked(m)){toast();return}state.m=m;state.l=l;save();render();closeNav();$('main').scrollTo({top:0,behavior:'smooth'})})}function render(){const m=modules[state.m],l=m.lessons[state.l],last=state.l===m.lessons.length-1;const introHtml=state.m===0&&state.l===0?`<section class="overview"><h1 class="overview-title">${esc(intro.title)}</h1><p class="sub">${esc(intro.sub)}</p><p>${esc(intro.hook)}</p><h2>What You Will Learn</h2><ul>${intro.learn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Who This Is For</h2><ul>${intro.for.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>What You Get</h2><ul>${intro.get.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="cta">Choose how you learn: ebook or guided course.</p></section>`:'';$('content').innerHTML=`${introHtml}<p class="eyebrow">Course Player</p><p class="muted">Module ${state.m+1} / Lesson ${state.l+1}</p><h1>${esc(l[0])}</h1>${state.l===0?`<p class="warn"><strong>Module Goal:</strong> ${esc(m.goal)}</p>`:''}<h2>Lesson Content</h2>${l[1].map(p=>`<p>${esc(p)}</p>`).join('')}<h2>Key Action</h2><p>Replace this placeholder with your final exercise, worksheet prompt, or video notes later.</p>${last?quizHtml(state.m):''}<div class="actions"><button class="secondary" id="prev" ${state.m===0&&state.l===0?'disabled':''}>Previous Lesson</button><button class="primary" id="next" ${next()?'' :'disabled'}>Next Lesson</button></div>`;$('prev').onclick=prev;$('next').onclick=()=>go(next());const f=$('quizForm');if(f)f.onsubmit=submitQuiz;nav();progress()}function quizHtml(i){if(complete(i))return`<section class="quiz done"><h2>Module Quiz Complete</h2><p class="green">You passed this quiz. The next module is unlocked.</p></section>`;const q=modules[i].quiz;return`<section class="quiz"><h2>Module ${i+1} Quiz</h2><p>Answer both questions correctly to unlock the next module.</p><form id="quizForm" data-m="${i}">${q.map((x,qi)=>`<fieldset><legend>${qi+1}. ${esc(x[0])}</legend>${x[1].map((o,oi)=>`<label class="option"><input type="radio" name="q${qi}" value="${oi}" required><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}<button class="primary" type="submit">Submit Quiz</button><div class="feedback" id="feed" role="status"></div></form></section>`}function submitQuiz(e){e.preventDefault();const i=+e.target.dataset.m,ok=modules[i].quiz.every((q,qi)=>+e.target.querySelector(`input[name=q${qi}]:checked`).value===q[2]);const feed=$('feed');if(!ok){feed.textContent='One or more answers are incorrect. Review the lesson and try again.';feed.className='feedback error';return}if(!complete(i))state.done.push(i);save();feed.textContent=i===modules.length-1?'Correct. You completed the full course.':'Correct. Module completed and the next module is unlocked.';feed.className='feedback success';setTimeout(render,650)}function next(){const m=modules[state.m];if(state.l<m.lessons.length-1)return{m:state.m,l:state.l+1};if(state.m<modules.length-1&&unlocked(state.m+1))return{m:state.m+1,l:0};return null}function prev(){if(state.l>0)go({m:state.m,l:state.l-1});else if(state.m>0)go({m:state.m-1,l:modules[state.m-1].lessons.length-1})}function go(t){if(!t)return;state.m=t.m;state.l=t.l;save();render();$('main').scrollTo({top:0,behavior:'smooth'})}function progress(){const p=Math.round(state.done.length/modules.length*100);$('pct').textContent=p+'%';$('fill').style.width=p+'%'}function toast(){alert('Complete previous module first.')}function openNav(){$('sidebar').classList.add('open');$('shade').classList.add('open')}function closeNav(){$('sidebar').classList.remove('open');$('shade').classList.remove('open')}$('openNav').onclick=openNav;$('closeNav').onclick=closeNav;$('shade').onclick=closeNav;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNav()});load();render();
</script>
</body>
</html>
